name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight run, but never a live deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The asset pipeline is NOT run here: it needs the ~5.3 GB of raw Drive
      # exports in portfolio/, which are gitignored. Optimised images, videos
      # and the manifest are committed, so the build works from those.
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://hardiksondagar.github.io
          BASE_PATH: /interiorbyjenish

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
